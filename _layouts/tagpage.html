---
layout: default
---
<div class="post">
<h1>Tag: {{ page.tag | replace: '-', " " }}</h1>
<ul>
{% for post in site.tags[page.tag] %}
  <li><a href="{{ post.url }}">{{ post.title }}</a> ({{ post.date | date: "%b %-d, %Y" }})<br>
    {{ post.description }}
  </li>
{% endfor %}
</ul>
</div>
<hr>
{{ content }}
