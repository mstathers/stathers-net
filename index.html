---
layout: default
title: Stathers.net
---
{% assign first_post = site.posts.first %}
<div id="page_title">
    <h2>{{ first_post.title }}</h2>
</div>
<div id="page_date">
    {{ first_post.date | date: "%-d %B %Y" }}

    {%- if first_post.tags -%}
        {% for tag in first_post.tags %}
            <a href="{{site.baseurl}}/tag/{{tag | slugize}}">
                #{{ tag }}
            </a>
        {% endfor %}
    {%- endif -%}
</div>

<div id="post">
{{ first_post.content }}
</div>
